<!DOCTYPE html>
<html lang="ru" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartDNS UI</title>
    <!-- Inline SVG Favicon -->
    <link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16"><text y="14" font-size="14">🌐</text></svg>'>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <!-- ДОБАВЛЕНО ДЛЯ ПОДСВЕТКИ СИНТАКСИСА -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.15/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.15/theme/dracula.min.css">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        .sidebar { min-height: calc(100vh - 56px); background-color: #212529; padding-top: 20px; }
        .nav-pills .nav-link { color: #adb5bd; border-radius: 0; padding: 10px 20px; cursor: pointer; }
        .nav-pills .nav-link.active { background-color: #0d6efd; color: white; }
        .nav-pills .nav-link:hover:not(.active) { background-color: #343a40; }
        textarea.code-font { font-family: monospace; font-size: 14px; background-color: #2b3035; color: #f8f9fa; border: 1px solid #495057; resize: none; }
        textarea.code-font:focus { background-color: #212529; color: #fff; border-color: #0d6efd; box-shadow: none; }
        .section-header { font-weight: bold; color: #0dcaf0; font-size: 14px; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        /* СТИЛЬ ДЛЯ РЕДАКТОРА С КОДОМ */
        .CodeMirror { height: 70vh; font-family: monospace; font-size: 14px; border-radius: 0.375rem; border: 1px solid #495057; }

        /* Keenetic-inspired compact interface */
        :root { color-scheme: dark; --panel-bg: #202b39; --panel-bg-soft: #263445; --panel-border: #3a4b60; --accent: #4c9cff; }
        body { background: #17212d; color: #e8eef5; font-size: 0.94rem; }
        .navbar { background: #1d2937 !important; border-color: var(--panel-border) !important; box-shadow: 0 2px 12px #0002; }
        .navbar-brand { letter-spacing: .2px; }
        .sidebar { background: #1b2735; border-color: var(--panel-border) !important; }
        .nav-pills .nav-link { margin: 2px 10px; padding: 10px 12px; border-radius: 8px; color: #b7c4d3; transition: background .15s ease, color .15s ease; }
        .nav-pills .nav-link.active { background: #315f91; color: #fff; box-shadow: inset 3px 0 #75b7ff; }
        .nav-pills .nav-link:hover:not(.active) { background: #29394b; color: #fff; }
        .card { --bs-card-bg: var(--panel-bg); border-color: var(--panel-border) !important; border-radius: 12px; overflow: hidden; }
        .card-header { background: #263548; border-color: var(--panel-border) !important; padding: .75rem 1rem !important; }
        .section-header { color: #d9e9fa; font-size: .88rem; letter-spacing: .1px; }
        .card-body { color: #dce5ef; }
        .btn { border-radius: 7px; }
        .btn-primary { background: #367bc0; border-color: #367bc0; }
        .btn-outline-secondary { border-color: #53657a; color: #d0dbe7; }
        .btn-outline-secondary:hover { background: #33475d; border-color: #607d9b; color: #fff; }
        .form-control, .form-select { background-color: #1a2634 !important; color: #e8eef5 !important; border-color: #43566b !important; }
        .form-control:focus, .form-select:focus { border-color: #5ba7ff !important; box-shadow: 0 0 0 .18rem #4c9cff28 !important; }
        .form-control::placeholder { color: #8fa0b3 !important; opacity: 1; }
        textarea.code-font { background: #182431; border-color: #35475a; }
        .CodeMirror { border-color: #35475a; }
        .group-item, .route-item { background: #202d3c !important; border-color: #3b4f64 !important; border-radius: 10px !important; padding: 12px !important; }
        .group-item + .group-item, .route-item + .route-item { margin-top: 10px; }
        .drag-handle { opacity: .65; }
        .drag-handle:hover { opacity: 1; color: #9ecbff !important; }
        .list-group-item { background: #202d3c; color: #dbe6f2; border-color: #3b4f64; }
        .list-group-item.active { background: #315f91; border-color: #477eb5; }
        .text-muted { color: #a2b1c1 !important; }
        .settings-section-hint { color: #9eafc1; font-size: .78rem; }
        @media (max-width: 767.98px) {
            .sidebar { min-height: auto; padding: 10px 0 !important; }
            .sidebar .nav { flex-direction: row !important; }
            .nav-pills .nav-link { flex: 1; text-align: center; margin: 2px 4px; padding: 8px 4px; }
            .container-fluid > .row > .col-md-10 { padding: 14px !important; }
            .navbar .form-check { display: none; }
            #global-save-btn { font-size: 0; }
            #global-save-btn .bi { font-size: 1rem; margin: 0 !important; }
        }

        /* Light, restrained Keenetic-like palette */
        body { background: #f1f4f8; color: #26364a; }
        .navbar { background: #fff !important; border-color: #d8e0e9 !important; }
        .navbar .navbar-brand { color: #24374c; }
        .navbar .text-light, .navbar .form-check-label { color: #34485e !important; }
        .sidebar { background: #fff; border-color: #d8e0e9 !important; }
        .sidebar .text-muted { color: #738397 !important; }
        .nav-pills .nav-link { color: #506277; }
        .nav-pills .nav-link.active { background: #e7f1fc; color: #155da7; box-shadow: inset 3px 0 #2785df; }
        .nav-pills .nav-link:hover:not(.active) { background: #f0f5fa; color: #24496e; }
        .card { --bs-card-bg: #fff; background: #fff !important; border-color: #d8e1eb !important; box-shadow: 0 2px 8px #23364a0a !important; }
        .card-header { background: #f7f9fc !important; border-color: #dfe6ee !important; color: #29435e; }
        .section-header { color: #29435e; }
        .group-item, .route-item { background: #fff !important; border-color: #dbe3ec !important; }
        .text-light { color: #293b50 !important; }
        .text-muted { color: #74859a !important; }
        .bg-dark { background-color: #fff !important; }
        .bg-secondary { background-color: #f3f6fa !important; }
        .border-secondary { border-color: #d8e1eb !important; }
        .form-control, .form-select { background-color: #fff !important; color: #26364a !important; border-color: #cbd6e2 !important; }
        .form-control:focus, .form-select:focus { border-color: #3991e8 !important; box-shadow: 0 0 0 .18rem #3991e82b !important; }
        .form-control::placeholder { color: #91a0b1 !important; }
        textarea.code-font, .form-control.code-font { background: #1e2938 !important; color: #edf3fa !important; border-color: #3a4b60 !important; }
        textarea.code-font:focus { background: #1e2938 !important; color: #fff !important; }
        .CodeMirror { border-color: #cbd6e2; }
        .list-group-item { background: #fff; color: #293b50; border-color: #d8e1eb; }
        .list-group-item.active { background: #e7f1fc; border-color: #b9d6f3; color: #155da7; }
        .settings-section-hint { color: #74859a; }
        .btn-outline-secondary { border-color: #c7d2df; color: #4a6078; }
        .btn-outline-secondary:hover { background: #eaf0f6; border-color: #aabbd0; color: #24374c; }
        #test-mode-toggle { cursor: pointer; }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark border-bottom border-secondary sticky-top">
    <div class="container-fluid">
        <a class="navbar-brand fw-bold" href="javascript:void(0);" onclick="resetToHome()">SmartDNS<span class="text-primary">Geo</span></a>
        
        <div class="d-flex align-items-center ms-auto gap-2">
            <!-- Кнопка обновления (всегда видима) -->
            <button id="btn-update" class="btn btn-outline-secondary btn-sm fw-bold position-relative me-3" disabled onclick="performUpdate()">
                <i class="bi bi-github me-1"></i> v<span id="current-version-text">...</span>
                <span id="update-badge" class="position-absolute top-0 start-100 translate-middle p-1 bg-success border border-dark rounded-circle d-none"></span>
            </button>
            
            <div class="form-check form-switch mx-3 mb-0">
                <input class="form-check-input" type="checkbox" id="test-mode-toggle" onchange="toggleTestMode(this.checked)">
                <label class="form-check-label text-light small" for="test-mode-toggle">Тест-режим</label>
            </div>
            <button id="global-save-btn" class="btn btn-outline-secondary btn-sm fw-bold" onclick="globalSave()" disabled>
                <i class="bi bi-floppy me-1"></i> Сохранить (Ctrl+S)
            </button>
            <button class="btn btn-warning btn-sm fw-bold" onclick="restartService()">
                <i class="bi bi-arrow-repeat me-1"></i> Рестарт
            </button>
        </div>
    </div>
</nav>

<div class="container-fluid">
    <div class="row">
        <div class="col-md-2 sidebar border-end border-secondary p-0">
            <div class="text-uppercase text-muted small px-3 mb-2 fw-bold">Меню</div>
            <div class="nav flex-column nav-pills">
                <a class="nav-link active" onclick="switchTab('settings', this)"><i class="bi bi-gear me-2"></i> Настройки</a>
                <a class="nav-link" onclick="switchTab('lists', this)"><i class="bi bi-list-ul me-2"></i> Списки</a>
                <a class="nav-link" onclick="switchTab('logs', this)"><i class="bi bi-journal-text me-2"></i> Логи</a>
            </div>
            <div class="px-3 mt-4 text-muted" style="font-size: 0.75rem;">
                <b>Хоткеи:</b><br>
                Ctrl+S - Сохранить<br>
                Ctrl+/ - Коммент (#)
            </div>
        </div>

        <div class="col-md-10 p-4">
            <div id="tab-settings" class="tab-content active">
                <div class="d-flex mb-3 gap-2">
                    <button id="btn-mode-ui" class="btn btn-sm btn-primary" onclick="switchSettingsMode('ui')">Визуальный режим</button>
                    <button id="btn-mode-raw" class="btn btn-sm btn-outline-secondary" onclick="switchSettingsMode('raw')">Сырой конфиг (Raw)</button>
                </div>
                
                <div id="settings-ui-view">
                    <div id="config-sections"></div>
                </div>
                <div id="settings-raw-view" style="display:none;">
                    <textarea id="raw-config-text" class="form-control code-font" rows="25" oninput="markConfigDirty()"></textarea>
                </div>
            </div>

            <div id="tab-lists" class="tab-content">
                <div class="row">
                    <div class="col-md-3">
                        <div id="lists-container" class="list-group mb-3"></div>
                        <div class="input-group">
                            <input type="text" id="new-list-name" class="form-control bg-dark text-light border-secondary" placeholder="Имя (без .list)">
                            <button class="btn btn-outline-success" onclick="createList()"><i class="bi bi-plus-lg"></i></button>
                        </div>
                    </div>
                    <div class="col-md-9">
                        <div class="card bg-dark border-secondary">
                            <div class="card-header border-secondary d-flex justify-content-between align-items-center">
                                <span id="current-list-title">Выберите список</span>
                                <button class="btn btn-sm btn-outline-danger" onclick="deleteList()"><i class="bi bi-trash"></i> Удалить</button>
                            </div>
                            <textarea id="list-content" class="form-control code-font border-0 rounded-0" rows="20" disabled oninput="markListDirty()"></textarea>
                        </div>
                    </div>
                </div>
            </div>

            <div id="tab-logs" class="tab-content">
                <div class="card bg-dark border-secondary">
                    <div class="card-header border-secondary d-flex justify-content-between align-items-center">
                        <span><i class="bi bi-journal-text me-2"></i>Логи</span>
                        <div>
                            <button class="btn btn-sm btn-warning" onclick="apiCall('clear_log').then(loadLog)"><i class="bi bi-broom"></i> Очистить</button>
                            <button class="btn btn-sm btn-outline-info ms-2" onclick="loadLog()"><i class="bi bi-arrow-clockwise"></i> Обновить</button>
                        </div>
                    </div>
                    <textarea id="log-content" class="form-control code-font border-0 rounded-0" rows="25" readonly></textarea>
                </div>
            </div>
        </div>
    </div>
</div>


<div class="modal fade" id="dns-server-modal" tabindex="-1" aria-labelledby="dns-server-modal-title" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-secondary" style="background:#202b39;color:#e8eef5">
            <div class="modal-header border-secondary">
                <h5 class="modal-title" id="dns-server-modal-title"><i class="bi bi-hdd-network me-2"></i>Добавить DNS-сервер</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Закрыть"></button>
            </div>
            <div class="modal-body">
                <label class="form-label small" for="dns-type">Тип DNS</label>
                <select id="dns-type" class="form-select mb-3" onchange="updateDnsModalFields()">
                    <option value="udp4">Обычный DNS · IPv4</option>
                    <option value="udp6">Обычный DNS · IPv6</option>
                    <option value="tcp">DNS over TCP</option>
                    <option value="dot">DNS over TLS (DoT)</option>
                    <option value="doh">DNS over HTTPS (DoH)</option>
                    <option value="doq">DNS over QUIC (DoQ)</option>
                    <option value="h3">DNS over HTTP/3</option>
                </select>
                <label class="form-label small" for="dns-address">Адрес сервера / домен</label>
                <input id="dns-address" class="form-control mb-3" type="text" placeholder="Например, 1.1.1.1 или cloudflare-dns.com">
                <div class="row g-3">
                    <div class="col-5">
                        <label class="form-label small" for="dns-port">Порт (необязательно)</label>
                        <input id="dns-port" class="form-control" type="number" min="1" max="65535" placeholder="По умолчанию">
                    </div>
                    <div class="col-7 d-none" id="dns-path-row">
                        <label class="form-label small" for="dns-path">Путь DoH / H3</label>
                        <input id="dns-path" class="form-control" type="text" value="/dns-query">
                    </div>
                </div>
                <div class="settings-section-hint mt-3">SmartDNS сформирует директиву и нужный протокол при сохранении конфига. TLS / QUIC / H3 не нужно дописывать вручную.</div>
            </div>
            <div class="modal-footer border-secondary">
                <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Отмена</button>
                <button type="button" class="btn btn-primary" onclick="addDnsServerFromModal()"><i class="bi bi-plus-lg me-1"></i>Добавить DNS</button>
            </div>
        </div>
    </div>
</div>

<!-- ДОБАВЛЕНО ДЛЯ ПОДСВЕТКИ СИНТАКСИСА И DRAG & DROP -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.15/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.15/addon/mode/simple.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>

<script src="parser.js?v=10"></script>
<script src="validator.js?v=1"></script>
<script src="version.js?v=1"></script>
<script src="app.js?v=11"></script>
</body>
</html>
