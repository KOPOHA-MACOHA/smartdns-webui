<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartDNS UI</title>
    <!-- Inline SVG Favicon -->
    <link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16"><text y="14" font-size="14">🌐</text></svg>'>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <!-- ДОБАВЛЕНО ДЛЯ ПОДСВЕТКИ СИНТАКСИСА -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.15/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.15/theme/dracula.min.css">
    <style>
        :root {
            color-scheme: light;
            --page: #f3f6f9; --surface: #fff; --surface-raised: #fff; --surface-muted: #f7f9fb;
            --line: #d9e1e9; --text: #26384b; --muted: #708196; --accent: #2684d9;
            --accent-soft: #e7f2fc; --field: #fff; --field-border: #cbd6e1;
            --shadow: 0 2px 8px rgba(27, 50, 74, .05);
        }
        :root[data-theme="dark"] {
            color-scheme: dark;
            --page: #111b27; --surface: #1b2735; --surface-raised: #202e3e; --surface-muted: #243346;
            --line: #34465a; --text: #e7eef6; --muted: #9aacc0; --accent: #65adf4;
            --accent-soft: #263f58; --field: #152231; --field-border: #40546a;
            --shadow: 0 2px 10px rgba(0, 0, 0, .12);
        }
        * { box-sizing: border-box; }
        body { margin: 0; background: var(--page); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 14px; }
        .navbar { min-height: 64px; padding: 0 22px; background: var(--surface) !important; border-color: var(--line) !important; box-shadow: var(--shadow); }
        .navbar-brand { color: var(--text) !important; font-size: 1.1rem; letter-spacing: -.2px; }
        .navbar-brand .text-primary { color: var(--accent) !important; }
        .navbar .text-light, .navbar .form-check-label { color: var(--text) !important; }
        .navbar .btn { min-height: 34px; }
        .container-fluid > .row { min-height: calc(100vh - 64px); }
        .sidebar { min-height: calc(100vh - 64px); padding: 22px 12px !important; background: var(--surface) !important; border-color: var(--line) !important; }
        .sidebar > .text-uppercase { padding: 0 12px !important; color: var(--muted) !important; font-size: 11px !important; letter-spacing: .08em; }
        .nav-pills .nav-link { display: flex; align-items: center; margin: 3px 0; padding: 11px 13px; gap: 2px; border-radius: 8px; color: var(--muted); transition: background .15s, color .15s; }
        .nav-pills .nav-link.active { background: var(--accent-soft); color: var(--accent); box-shadow: inset 3px 0 var(--accent); font-weight: 600; }
        .nav-pills .nav-link:hover:not(.active) { background: var(--surface-muted); color: var(--text); }
        .sidebar .text-muted { color: var(--muted) !important; }
        .col-md-10 { padding: 28px 32px !important; }
        .tab-content { display: none; } .tab-content.active { display: block; }
        #settings-ui-view { max-width: 1120px; }
        .card { background: var(--surface) !important; border: 1px solid var(--line) !important; border-radius: 10px; box-shadow: var(--shadow); overflow: hidden; }
        .card-header { min-height: 48px; display: flex; align-items: center; padding: 10px 16px !important; background: var(--surface-muted) !important; border-bottom: 1px solid var(--line) !important; color: var(--text) !important; }
        .section-header { color: var(--text) !important; font-size: 13px; font-weight: 650; letter-spacing: .01em; }
        .card-body { color: var(--text); }
        .group-item, .route-item { padding: 14px !important; margin-bottom: 12px !important; background: var(--surface) !important; border: 1px solid var(--line) !important; border-radius: 10px !important; box-shadow: var(--shadow); }
        .group-item + .group-item, .route-item + .route-item { margin-top: 0; }
        .form-control, .form-select { min-height: 36px; background: var(--field) !important; color: var(--text) !important; border: 1px solid var(--field-border) !important; border-radius: 7px !important; box-shadow: none; }
        .form-control:focus, .form-select:focus { border-color: var(--accent) !important; box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 17%, transparent) !important; }
        .form-control::placeholder { color: var(--muted) !important; opacity: .8; }
        .form-check-input { background-color: var(--field); border-color: var(--field-border); }
        .form-check-input:checked { background-color: var(--accent); border-color: var(--accent); }
        .btn { display: inline-flex; align-items: center; justify-content: center; gap: 5px; border-radius: 7px; font-weight: 550; }
        .btn-primary { background: var(--accent) !important; border-color: var(--accent) !important; color: #fff !important; }
        .btn-outline-primary { color: var(--accent) !important; border-color: color-mix(in srgb, var(--accent) 50%, var(--line)) !important; }
        .btn-outline-primary:hover { background: var(--accent-soft) !important; }
        .btn-outline-secondary { color: var(--text) !important; border-color: var(--line) !important; }
        .btn-outline-secondary:hover { background: var(--surface-muted) !important; }
        .btn-link { text-decoration: none; }
        .text-light { color: var(--text) !important; } .text-muted { color: var(--muted) !important; }
        .bg-dark, .bg-secondary { background: var(--surface-muted) !important; }
        .border-secondary { border-color: var(--line) !important; }
        .settings-section-hint { color: var(--muted); font-size: 12px; }
        .editable-name { display: flex; align-items: center; gap: 8px; min-width: 0; }
        .editable-name > span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .editable-name > input { flex: 0 1 320px; max-width: 100%; }
        .editable-name:not(.is-editing) > input { display: none !important; }
        .editable-name.is-editing > span { display: none !important; }
        .editable-name.is-editing > input { display: block !important; }
        .icon-action { display: inline-flex; align-items: center; justify-content: center; width: 32px; height: 32px; flex: 0 0 32px; padding: 0; border: 1px solid transparent; border-radius: 7px; background: transparent; color: var(--muted); }
        .icon-action:hover { background: var(--surface-muted); color: var(--text); }
        .icon-action.danger:hover { color: #d9534f; background: #d9534f12; }
        .drag-handle { opacity: .45; cursor: grab; } .drag-handle:hover { opacity: 1; color: var(--accent) !important; }
        .dns-server-list { display: flex; flex-direction: column; gap: 0; padding: 0 16px; }
        .dns-server-row { min-height: 54px; padding: 8px 2px; border-bottom: 1px solid var(--line); }
        .dns-server-row:last-child { border-bottom: 0; }
        .dns-protocol { display: inline-flex; justify-content: center; min-width: 70px; padding: 4px 8px; border-radius: 5px; background: var(--accent-soft); color: var(--accent); font-size: 11px; font-weight: 700; letter-spacing: .02em; }
        .dns-endpoint { color: var(--text); font-size: 13px; font-family: ui-monospace, SFMono-Regular, Consolas, monospace; }
        .dns-empty { padding: 16px 0; color: var(--muted); font-size: 13px; }
        .route-file-row { padding: 4px 0; } .route-file-row .form-control { min-width: 0; }
        .route-group { width: 230px; }
        textarea.code-font { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 13px; background: var(--field) !important; color: var(--text) !important; border: 1px solid var(--field-border) !important; resize: vertical; }
        #raw-config-text, #list-content, #log-content { background: #172331 !important; color: #e6edf5 !important; border-color: var(--line) !important; }
        .CodeMirror { height: 70vh; border: 1px solid var(--line); border-radius: 7px; font: 13px ui-monospace, SFMono-Regular, Consolas, monospace; }
        .list-group-item { background: var(--surface); color: var(--text); border-color: var(--line); }
        .list-group-item.active { background: var(--accent-soft); color: var(--accent); border-color: var(--line); }
        .modal-content { background: var(--surface) !important; color: var(--text) !important; border: 1px solid var(--line) !important; border-radius: 12px; }
        .modal-header, .modal-footer { border-color: var(--line) !important; }
        .btn-close { filter: var(--close-filter, none); }
        :root[data-theme="dark"] .btn-close { filter: invert(1) grayscale(1); }
        #theme-toggle { min-width: 36px; width: 36px; height: 36px; padding: 0; border-radius: 50%; }
        @media (max-width: 767.98px) {
            .navbar { padding: 8px 12px; }
            .navbar .form-check { display: none; }
            .container-fluid > .row { min-height: auto; }
            .sidebar { min-height: auto; padding: 8px !important; }
            .sidebar .nav { flex-direction: row !important; }
            .nav-pills .nav-link { flex: 1; justify-content: center; margin: 2px; padding: 9px 4px; font-size: 12px; }
            .col-md-10 { padding: 16px !important; }
            #global-save-btn { font-size: 0; min-width: 36px; }
            #global-save-btn .bi { font-size: 1rem; margin: 0 !important; }
            .route-group { width: min(230px, 48vw); }
            .dns-server-list { padding: 0 10px; }
            .dns-server-row { gap: 8px !important; }
            .dns-protocol { min-width: 58px; }
        }
    </style>yle>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark border-bottom border-secondary sticky-top">
    <div class="container-fluid">
        <a class="navbar-brand fw-bold" href="javascript:void(0);" onclick="resetToHome()">SmartDNS<span class="text-primary">Geo</span></a>
        
        <div class="d-flex align-items-center ms-auto gap-2">
            <!-- Кнопка обновления (всегда видима) -->
            <button id="btn-update" class="btn btn-outline-secondary btn-sm fw-bold position-relative me-3" disabled onclick="performUpdate()">
                <i class="bi bi-github me-1"></i> v<span id="current-version-text">...</span>
                <span id="update-badge" class="position-absolute top-0 start-100 translate-middle p-1 bg-success border border-dark rounded-circle d-none"></span>
            </button>
            
            <div class="form-check form-switch mx-3 mb-0">
                <input class="form-check-input" type="checkbox" id="test-mode-toggle" onchange="toggleTestMode(this.checked)">
                <label class="form-check-label text-light small" for="test-mode-toggle">Тест-режим</label>
            </div>
            <button id="theme-toggle" class="btn btn-outline-secondary btn-sm me-1" type="button" onclick="toggleTheme()" title="Переключить тему" aria-label="Переключить тему"><i class="bi bi-moon-stars"></i></button>
            <button id="global-save-btn" class="btn btn-outline-secondary btn-sm fw-bold" onclick="globalSave()" disabled>
                <i class="bi bi-floppy me-1"></i> Сохранить (Ctrl+S)
            </button>
            <button class="btn btn-warning btn-sm fw-bold" onclick="restartService()">
                <i class="bi bi-arrow-repeat me-1"></i> Рестарт
            </button>
        </div>
    </div>
</nav>

<div class="container-fluid">
    <div class="row">
        <div class="col-md-2 sidebar border-end border-secondary p-0">
            <div class="text-uppercase text-muted small px-3 mb-2 fw-bold">Меню</div>
            <div class="nav flex-column nav-pills">
                <a class="nav-link active" onclick="switchTab('settings', this)"><i class="bi bi-gear me-2"></i> Настройки</a>
                <a class="nav-link" onclick="switchTab('lists', this)"><i class="bi bi-list-ul me-2"></i> Списки</a>
                <a class="nav-link" onclick="switchTab('logs', this)"><i class="bi bi-journal-text me-2"></i> Логи</a>
            </div>
            <div class="px-3 mt-4 text-muted" style="font-size: 0.75rem;">
                <b>Хоткеи:</b><br>
                Ctrl+S - Сохранить<br>
                Ctrl+/ - Коммент (#)
            </div>
        </div>

        <div class="col-md-10 p-4">
            <div id="tab-settings" class="tab-content active">
                <div class="d-flex mb-3 gap-2">
                    <button id="btn-mode-ui" class="btn btn-sm btn-primary" onclick="switchSettingsMode('ui')">Визуальный режим</button>
                    <button id="btn-mode-raw" class="btn btn-sm btn-outline-secondary" onclick="switchSettingsMode('raw')">Сырой конфиг (Raw)</button>
                </div>
                
                <div id="settings-ui-view">
                    <div id="config-sections"></div>
                </div>
                <div id="settings-raw-view" style="display:none;">
                    <textarea id="raw-config-text" class="form-control code-font" rows="25" oninput="markConfigDirty()"></textarea>
                </div>
            </div>

            <div id="tab-lists" class="tab-content">
                <div class="row">
                    <div class="col-md-3">
                        <div id="lists-container" class="list-group mb-3"></div>
                        <div class="input-group">
                            <input type="text" id="new-list-name" class="form-control bg-dark text-light border-secondary" placeholder="Имя (без .list)">
                            <button class="btn btn-outline-success" onclick="createList()"><i class="bi bi-plus-lg"></i></button>
                        </div>
                    </div>
                    <div class="col-md-9">
                        <div class="card bg-dark border-secondary">
                            <div class="card-header border-secondary d-flex justify-content-between align-items-center">
                                <span id="current-list-title">Выберите список</span>
                                <button class="btn btn-sm btn-outline-danger" onclick="deleteList()"><i class="bi bi-trash"></i> Удалить</button>
                            </div>
                            <textarea id="list-content" class="form-control code-font border-0 rounded-0" rows="20" disabled oninput="markListDirty()"></textarea>
                        </div>
                    </div>
                </div>
            </div>

            <div id="tab-logs" class="tab-content">
                <div class="card bg-dark border-secondary">
                    <div class="card-header border-secondary d-flex justify-content-between align-items-center">
                        <span><i class="bi bi-journal-text me-2"></i>Логи</span>
                        <div>
                            <button class="btn btn-sm btn-warning" onclick="apiCall('clear_log').then(loadLog)"><i class="bi bi-broom"></i> Очистить</button>
                            <button class="btn btn-sm btn-outline-info ms-2" onclick="loadLog()"><i class="bi bi-arrow-clockwise"></i> Обновить</button>
                        </div>
                    </div>
                    <textarea id="log-content" class="form-control code-font border-0 rounded-0" rows="25" readonly></textarea>
                </div>
            </div>
        </div>
    </div>
</div>


<div class="modal fade" id="dns-server-modal" tabindex="-1" aria-labelledby="dns-server-modal-title" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-secondary">
            <div class="modal-header border-secondary">
                <h5 class="modal-title" id="dns-server-modal-title"><i class="bi bi-hdd-network me-2"></i>Добавить DNS-сервер</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Закрыть"></button>
            </div>
            <div class="modal-body">
                <label class="form-label small" for="dns-type">Тип DNS</label>
                <select id="dns-type" class="form-select mb-3" onchange="updateDnsModalFields()">
                    <option value="udp4">Обычный DNS · IPv4</option>
                    <option value="udp6">Обычный DNS · IPv6</option>
                    <option value="tcp">DNS over TCP</option>
                    <option value="dot">DNS over TLS (DoT)</option>
                    <option value="doh">DNS over HTTPS (DoH)</option>
                    <option value="doq">DNS over QUIC (DoQ)</option>
                    <option value="h3">DNS over HTTP/3</option>
                </select>
                <label class="form-label small" for="dns-address">Адрес сервера / домен</label>
                <input id="dns-address" class="form-control mb-3" type="text" placeholder="Например, 1.1.1.1 или cloudflare-dns.com">
                <div class="row g-3">
                    <div class="col-5">
                        <label class="form-label small" for="dns-port">Порт (необязательно)</label>
                        <input id="dns-port" class="form-control" type="number" min="1" max="65535" placeholder="По умолчанию">
                    </div>
                    <div class="col-7 d-none" id="dns-path-row">
                        <label class="form-label small" for="dns-path">Путь DoH / H3</label>
                        <input id="dns-path" class="form-control" type="text" value="/dns-query">
                    </div>
                </div>
                <div class="settings-section-hint mt-3">SmartDNS сформирует директиву и нужный протокол при сохранении конфига. TLS / QUIC / H3 не нужно дописывать вручную.</div>
            </div>
            <div class="modal-footer border-secondary">
                <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Отмена</button>
                <button type="button" class="btn btn-primary" onclick="addDnsServerFromModal()"><i class="bi bi-plus-lg me-1"></i>Добавить DNS</button>
            </div>
        </div>
    </div>
</div>

<!-- ДОБАВЛЕНО ДЛЯ ПОДСВЕТКИ СИНТАКСИСА И DRAG & DROP -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.15/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.15/addon/mode/simple.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>

<script src="parser.js?v=13"></script>
<script src="validator.js?v=1"></script>
<script src="version.js?v=1"></script>
<script src="app.js?v=13"></script>
</body>
</html>
